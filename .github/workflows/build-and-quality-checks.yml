name: Code Quality Checks
on:
  pull_request:
    branches: ['master']
    types: ['opened', 'reopened', 'synchronize']

permissions:
  contents: read

jobs:
  build:
    name: Code Quality Checks (${{ matrix.linkage }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: static libraries
            lint_flags: --use-libraries
          - linkage: static frameworks
            lint_flags: --use-static-frameworks
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout source branch
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        
      - name: Install Cocoapods
        run: gem install cocoapods
      
      - name: Execute pod lint
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/DeploymentTarget.xcconfig
        run: pod lib lint ${{ matrix.lint_flags }} --no-clean --allow-warnings --verbose
